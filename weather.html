<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <div class="weather">
        <h1> WEATHER APP</h1>
        <div class="searchbox">
            <input type="text" id="city" placeholder="Enter the city name">
            <button onclick="getweather()">Search</button>
        </div>
        <div class="weatheresult">
            <img src="https://images.unsplash.com/photo-1705077296278-d82dd5c8662f?q=80&w=1109&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" width="150" height="100">
            <h2 id="cityname">Search a city</h2>
            <p id="temperature">--C</p>
            <p id="condition">---</p>
            <div class="details">
                <p>
                    Humidity:
                    <span id="humidity">--</span>%
                </p>
                <p>
                    Wind:
                    <span id="wind">--</span>km/h
                </p>
            </div>
        </div>
    </div>
    <script src="weather.js"></script>
</body>
</html>
